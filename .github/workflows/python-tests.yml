name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # nodejs is a conda package in README, not a pip dep
          grep -vE '^nodejs([[:space:]]|$)' requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt
      - name: Run src/*_test.py
        run: python test_harness.py
